body {

      <form id="exerciseForm">

        <input type="text" id="exName" placeholder="Nombre del ejercicio" class="w-full p-4 mb-4 bg-gray-700 rounded-2xl" required>

        <div class="flex gap-4 mt-8">

  <!-- Modal Partidos -->

      <h2 id="matchTitle" class="text-2xl font-bold mb-5">Nuevo Partido</h2>
      <form id="matchForm">

        <div class="flex gap-4 mt-8">

  <!-- Modal Táctica -->

        <button onclick="addPlayerMarker('#ef4444', '2')" class="w-11 h-11 rounded-full bg-red-500 text-white font-bold">2</button>
        <button onclick="addPlayerMarker('#ef4444', '3')" class="w-11 h-11 rounded-full bg-red-500 text-white font-bold">3</button>
        <button onclick="addPlayerMarker('#ef4444', '4')" class="w-11 h-11 rounded-full bg-red-500 text-white font-bold">4</button>
        <button onclick="addPlayerMarker('#ef4444', '5')" class="w-11 h-11 rounded-full bg-red-500 text-white font-bold">5</button>
      </div>
      <div class="text-center text-yellow-400 font-bold mb-2">EQUIPO AMARILLO (Visitante)</div>
      <div class="flex justify-center gap-3">
        <button onclick="addPlayerMarker('#eab308', '6')" class="w-11 h-11 rounded-full bg-yellow-500 text-black font-bold">6</button>
        <button onclick="addPlayerMarker('#eab308', '7')" class="w-11 h-11 rounded-full bg-yellow-500 text-black font-bold">7</button>
        <button onclick="addPlayerMarker('#eab308', '8')" class="w-11 h-11 rounded-full bg-yellow-500 text-black font-bold">8</button>
        <button onclick="addPlayerMarker('#eab308', '9')" class="w-11 h-11 rounded-full bg-yellow-500 text-black font-bold">9</button>
        <button onclick="addPlayerMarker('#eab308', '10')" class="w-11 h-11 rounded-full bg-yellow-500 text-black font-bold">10</button>
      </div>
      <button onclick="saveTactics()" class="mt-3 w-full py-3 bg-green-600 rounded-2xl font-bold">💾 Guardar Táctica</button>
<button onclick="clearBoard()" class="mt-3 w-full py-3 bg-red-700 rounded-2xl font-bold">🧹 Limpiar todo</button>
      <button onclick="saveTactics()" class="mt-3 w-full py-3 bg-green-600 rounded-2xl font-bold">💾 Guardar Táctica</button>
<button onclick="clearBoard()" class="mt-3 w-full py-3 bg-red-700 rounded-2xl font-bold">🧹 Limpiar todo</button>
<button onclick="saveTactics()" class="mt-3 w-full py-3 bg-green-600 rounded-2xl font-bold">💾 Guardar Táctica</button>
<button onclick="clearBoard()" class="mt-3 w-full py-3 bg-red-700 rounded-2xl font-bold">🧹 Limpiar todo</button>      
<button onclick="clearBoard()" class="mt-6 w-full py-3 bg-red-700 rounded-2xl font-bold">🧹 Limpiar todo</button>

  <script>
    // ==================== USUARIOS ====================
    let users = JSON.parse(localStorage.getItem('futsalUsers')) || [
      { username: "jefe", password: "futsal2026", role: "admin" }
    ];

    function checkLogin() {
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const user = users.find(u => u.username === username && u.password === password);
      
      if (user) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainHeader').classList.remove('hidden');
        document.getElementById('mainNav').classList.remove('hidden');
        showSection('players');
      } else {
        document.getElementById('loginError').classList.remove('hidden');
        setTimeout(() => document.getElementById('loginError').classList.add('hidden'), 3000);
      }
    }

    function showAdminPanel() {
      if (!users.some(u => u.role === "admin")) {
        alert("Solo el administrador puede entrar aquí");
        return;
      }
      document.getElementById('adminPanel').classList.remove('hidden');
      renderUsersList();
    }

    function closeAdmin() {
      document.getElementById('adminPanel').classList.add('hidden');
    }

    function renderUsersList() {
      const list = document.getElementById('usersList');
      list.innerHTML = users.map((u, i) => `
        <div class="bg-gray-700 rounded-2xl p-4 mb-3 flex justify-between items-center">
          <div>
            <p class="font-bold">${u.username}</p>
            <p class="text-xs text-gray-400">${u.role || 'usuario'}</p>
          </div>
          ${u.role !== 'admin' ? `<button onclick="deleteUser(${i})" class="px-4 py-2 bg-red-600 rounded-xl text-sm">Borrar</button>` : '<span class="text-green-400">Administrador</span>'}
        </div>
      `).join('');
    }

    function showNewUserForm() {
      const username = prompt("Nombre del nuevo usuario:");
      if (!username) return;
      const password = prompt("Contraseña para " + username + ":");
      if (!password) return;
      if (users.find(u => u.username === username)) return alert("Ese usuario ya existe");
      users.push({ username, password, role: "user" });
      localStorage.setItem('futsalUsers', JSON.stringify(users));
      renderUsersList();
      alert("Usuario creado correctamente");
    }

    function deleteUser(i) {
      if (confirm("¿Borrar este usuario?")) {
        users.splice(i, 1);
        localStorage.setItem('futsalUsers', JSON.stringify(users));
        renderUsersList();
      }
    }

    // ==================== PARTIDOS ====================
    let matches = JSON.parse(localStorage.getItem('futsalMatches')) || [];

    function showMatches() {
      document.getElementById('content').innerHTML = `
        <div class="flex justify-between mb-6">
          <h2 class="text-3xl font-bold">📆 Partidos (${matches.length})</h2>
          <button onclick="openMatchModal()" class="bg-orange-600 px-6 py-3 rounded-2xl font-bold">➕ Nuevo Partido</button>
        </div>
        <div id="matchesList" class="space-y-4"></div>
      `;
      renderMatches();
    }

    function renderMatches() {
      const container = document.getElementById('matchesList');
      container.innerHTML = matches.length === 0 ? `<p class="text-center py-12 text-gray-400">Aún no hay partidos programados</p>` : '';
      matches.sort((a,b) => new Date(a.date) - new Date(b.date));
      matches.forEach((m, i) => {
        const div = document.createElement('div');
        div.className = "bg-gray-800 rounded-3xl p-6";
        div.innerHTML = `
          <div class="flex justify-between text-sm text-orange-400">
            <span>${m.date} ${m.time ? '• ' + m.time : ''}</span>
            <span class="font-bold">${m.result || '-'}</span>
          </div>
          <h3 class="font-bold text-xl mt-1">${m.opponent}</h3>
          <p class="text-gray-400">${m.location || 'Sin pabellón'}</p>
          ${m.notes ? `<p class="text-sm text-gray-300 mt-3">${m.notes}</p>` : ''}
          <div class="flex gap-3 mt-5">
            <button onclick="editMatch(${i});event.stopImmediatePropagation()" class="flex-1 py-3 bg-gray-700 rounded-2xl">Editar</button>
            <button onclick="deleteMatch(${i});event.stopImmediatePropagation()" class="flex-1 py-3 bg-red-900 rounded-2xl">Borrar</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function openMatchModal(index = null) {
      document.getElementById('matchModal').classList.remove('hidden');
      document.getElementById('matchForm').reset();
      document.getElementById('matchIndex').value = index !== null ? index : '';
      document.getElementById('matchTitle').textContent = index !== null ? "Editar Partido" : "Nuevo Partido";
    }

    function closeMatchModal() {
      document.getElementById('matchModal').classList.add('hidden');
    }

    document.getElementById('matchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const index = document.getElementById('matchIndex').value;
      const match = {
        date: document.getElementById('mDate').value,
        time: document.getElementById('mTime').value,
        opponent: document.getElementById('mOpponent').value,
        location: document.getElementById('mLocation').value,
        result: document.getElementById('mResult').value,
        notes: document.getElementById('mNotes').value
      };
      if (index === '') matches.push(match);
      else matches[index] = match;
      localStorage.setItem('futsalMatches', JSON.stringify(matches));
      closeMatchModal();
      showMatches();
    });

    function editMatch(i) { openMatchModal(i); }
    function deleteMatch(i) {
      if (confirm(`¿Borrar partido contra ${matches[i].opponent}?`)) {
        matches.splice(i, 1);
        localStorage.setItem('futsalMatches', JSON.stringify(matches));
        showMatches();
      }
    }

    // ==================== VARIABLES GLOBALES ====================
    let players = JSON.parse(localStorage.getItem('futsalPlayers')) || [];
    let trainings = JSON.parse(localStorage.getItem('futsalTrainings')) || [];
    let exercises = JSON.parse(localStorage.getItem('futsalExercises')) || [];
    let currentColor = '#f59e0b';
    let canvas, ctx, painting = false;
    let playersOnBoard = [];
    let savedTactics = JSON.parse(localStorage.getItem('futsalTactics')) || {
  drawingData: null,      // base64 de la imagen del canvas
  playersOnBoard: []
};

    function showSection(section) {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
      document.getElementById('btn-' + section).classList.add('nav-active');
      if (section === 'players') showPlayers();
      else if (section === 'trainings') showTrainings();
      else if (section === 'exercises') showExercises();
      else if (section === 'tactics') showTactics();
      else if (section === 'matches') showMatches();
    }

    // ==================== TÁCTICA ====================
    function showTactics() {
      document.getElementById('content').innerHTML = `
        <div class="text-center py-20">
          <h2 class="text-4xl font-bold mb-6">Pizarra Táctica</h2>
          <button onclick="openTacticsModal()" class="bg-orange-600 px-14 py-6 rounded-3xl text-2xl font-bold">🖌️ Abrir Campo</button>
        </div>`;
    }

    function loadTactics() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  playersOnBoard = [...savedTactics.playersOnBoard]; // copia para no modificar original

  // Si hay imagen guardada, la cargamos primero
  if (savedTactics.drawingData) {
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      drawPlayers(); // dibujamos los jugadores encima
    };
    img.src = savedTactics.drawingData;
  } else {
    drawPlayers();
  }
}

function saveTactics() {
  // Guardamos la imagen completa del canvas
  savedTactics.drawingData = canvas.toDataURL('image/png');
  savedTactics.playersOnBoard = [...playersOnBoard];
  
  localStorage.setItem('futsalTactics', JSON.stringify(savedTactics));
  
  // Feedback guapo
  const btn = document.createElement('div');
  btn.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#10b981; color:black; padding:12px 24px; border-radius:9999px; font-weight:bold; z-index:999;';
  btn.textContent = '✅ Táctica guardada';
  document.body.appendChild(btn);
  setTimeout(() => btn.remove(), 2000);
}

    function openTacticsModal() {
  document.getElementById('tacticsModal').classList.remove('hidden');
  setTimeout(() => {
    initCanvas();
    loadTactics();        // ← nuevo
  }, 100);
}

    function initCanvas() {canvas.style.touchAction = 'none';
canvas.style.webkitUserSelect = 'none';
      canvas = document.getElementById('tacticCanvas');
      ctx = canvas.getContext('2d');
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      canvas.addEventListener('mousedown', () => painting = true);
      canvas.addEventListener('mouseup', () => { painting = false; ctx.beginPath(); });
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('touchstart', () => painting = true);
      canvas.addEventListener('touchend', () => { painting = false; ctx.beginPath(); });
      canvas.addEventListener('touchmove', draw);
    }

    function addPlayerMarker(color, number) {
      canvas.style.cursor = 'crosshair';
      const handler = (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        playersOnBoard.push({x, y, color, number});
        drawPlayers();
        canvas.removeEventListener('click', handler);
        canvas.style.cursor = 'crosshair';
      };
      canvas.addEventListener('click', handler);
    }

    function drawPlayers() {
      ctx.save();
      playersOnBoard.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.number, p.x, p.y);
      });
      ctx.restore();
    }

    function draw(e) {
      if (!painting) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches[0].clientX) - rect.left;
      const y = (e.clientY || e.touches[0].clientY) - rect.top;
      ctx.strokeStyle = currentColor;
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    function changeColor(c) { currentColor = c; }
    function clearBoard() {
  if (confirm("¿Borrar toda la pizarra? (no se puede deshacer)")) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    playersOnBoard = [];
    savedTactics.drawingData = null;
    savedTactics.playersOnBoard = [];
    localStorage.setItem('futsalTactics', JSON.stringify(savedTactics));
  }
}
    function closeTacticsModal() {
  if (playersOnBoard.length > 0 || savedTactics.drawingData) {
    if (confirm("¿Guardar cambios de la pizarra antes de salir?")) {
      saveTactics();
    }
  }
  document.getElementById('tacticsModal').classList.add('hidden');
}

    // ==================== JUGADORES ====================
    function showPlayers() {
      document.getElementById('content').innerHTML = `
        <div class="flex justify-between mb-6">
          <h2 class="text-3xl font-bold">Plantilla (${players.length})</h2>
          <button onclick="openPlayerModal()" class="bg-orange-600 px-6 py-3 rounded-2xl font-bold">➕ Nuevo Jugador</button>
        </div>
        <div id="playersGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      `;
      renderPlayers();
    }
    function renderPlayers() {
      const grid = document.getElementById('playersGrid');
      grid.innerHTML = players.length === 0 ? `<p class="text-center py-12 text-gray-400">Aún no hay jugadores</p>` : '';
      players.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = "bg-gray-800 rounded-3xl overflow-hidden";
        div.innerHTML = `
          <div class="h-52 bg-gray-700">
            ${p.photo ? `<img src="${p.photo}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-7xl">👤</div>`}
          </div>
          <div class="p-5">
            <div class="flex justify-between">
              <h3 class="font-bold">${p.name}</h3>
              <span class="bg-orange-600 px-4 py-1 rounded-2xl">${p.number || '-'}</span>
            </div>
            <p class="text-orange-400">${p.position || ''}</p>
            ${p.notes ? `<p class="text-sm text-gray-400 mt-2">${p.notes}</p>` : ''}
            <div class="flex gap-3 mt-4">
              <button onclick="editPlayer(${i});event.stopImmediatePropagation()" class="flex-1 py-3 bg-gray-700 rounded-2xl">Editar</button>
              <button onclick="deletePlayer(${i});event.stopImmediatePropagation()" class="flex-1 py-3 bg-red-900 rounded-2xl">Borrar</button>
            </div>
          </div>
        `;
        grid.appendChild(div);
      });
    }
    function openPlayerModal(index = null) {
      document.getElementById('playerModal').classList.remove('hidden');
      document.getElementById('playerForm').reset();
      document.getElementById('preview').classList.add('hidden');
      document.getElementById('playerIndex').value = index !== null ? index : '';
    }
    function closePlayerModal() {
      document.getElementById('playerModal').classList.add('hidden');
    }
    document.getElementById('playerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const index = document.getElementById('playerIndex').value;
      const file = document.getElementById('photoInput').files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => savePlayer(index, ev.target.result);
        reader.readAsDataURL(file);
      } else {
        savePlayer(index, players[index] ? players[index].photo : '');
      }
    });
    function savePlayer(index, photo) {
      const player = {
        name: document.getElementById('pName').value.trim(),
        position: document.getElementById('pPosition').value.trim(),
        number: document.getElementById('pNumber').value,
        notes: document.getElementById('pNotes').value.trim(),
        photo: photo
      };
      if (index === '') players.push(player);
      else players[index] = player;
      localStorage.setItem('futsalPlayers', JSON.stringify(players));
      closePlayerModal();
      showPlayers();
    }
    function editPlayer(i) { openPlayerModal(i); }
    function deletePlayer(i) {
      if (confirm(`¿Borrar a ${players[i].name}?`)) {
        players.splice(i, 1);
        localStorage.setItem('futsalPlayers', JSON.stringify(players));
        showPlayers();
      }
    }

    // ==================== ENTRENOS ====================
    function showTrainings() {
      document.getElementById('content').innerHTML = `
        <div class="flex justify-between mb-6">
          <h2 class="text-3xl font-bold">Entrenamientos (${trainings.length})</h2>
          <button onclick="openTrainingModal()" class="bg-orange-600 px-6 py-3 rounded-2xl font-bold">➕ Nuevo</button>
        </div>
        <div id="trainingsList" class="space-y-4"></div>
      `;
      renderTrainings();
    }
    function renderTrainings() {
      const container = document.getElementById('trainingsList');
      container.innerHTML = trainings.length === 0 ? `<p class="text-center py-12 text-gray-400">Aún no hay entrenamientos</p>` : '';
      trainings.forEach((t, i) => {
        const div = document.createElement('div');
        div.className = "bg-gray-800 rounded-3xl p-6 cursor-pointer";
        div.innerHTML = `
  ...
  <div class="flex gap-3 mt-5">
    <button onclick="showTrainingDetail(${i}); event.stopImmediatePropagation()" class="flex-1 py-3 bg-orange-600 rounded-2xl font-bold">👁️ Ver Detalle</button>
    <button onclick="editTraining(${i}); event.stopImmediatePropagation()" class="flex-1 py-3 bg-gray-700 rounded-2xl">Editar</button>
    <button onclick="deleteTraining(${i}); event.stopImmediatePropagation()" class="flex-1 py-3 bg-red-900 rounded-2xl">Borrar</button>
  </div>
`;
          <h3 class="font-bold text-xl mt-2">${t.title}</h3>
          ${t.exercises && t.exercises.length ? `<p class="text-sm mt-2 text-gray-300">Ejercicios: ${t.exercises.join(', ')}</p>` : ''}
          <div class="flex gap-3 mt-5">
            <button onclick="showTrainingDetail(${i}); event.stopImmediatePropagation()" class="flex-1 py-3 bg-orange-600 rounded-2xl font-bold">👁️ Ver Detalle</button>
            <button onclick="editTraining(${i}); event.stopImmediatePropagation()" class="flex-1 py-3 bg-gray-700 rounded-2xl">Editar</button>
            <button onclick="deleteTraining(${i}); event.stopImmediatePropagation()" class="flex-1 py-3 bg-red-900 rounded-2xl">Borrar</button>
          </div>
        `;
        container.appendChild(div);
      });
    }
    function showTrainingDetail(i) {
      const t = trainings[i];
      let html = `<h2 class="text-2xl font-bold mb-4">${t.title}</h2>`;
      html += `<p class="mb-4">📅 ${t.date || 'Sin fecha'} • ${t.duration ? t.duration + ' min' : ''}</p>`;
      if (t.exercises && t.exercises.length) {
        html += `<h3 class="font-bold mb-3">Ejercicios del entreno:</h3>`;
        t.exercises.forEach(name => {
          const ex = exercises.find(e => e.name === name);
          html += `
            <div onclick="openPdfFromTraining('${name}')" class="bg-gray-700 rounded-2xl p-4 mb-3 flex items-center gap-4 cursor-pointer hover:bg-gray-600">
              <div class="w-12 h-12 bg-red-600 rounded-xl flex items-center justify-center text-3xl">📕</div>
              <div class="flex-1">
                <p class="font-medium">${name}</p>
                ${ex ? `<p class="text-sm text-gray-400">${ex.type || ''}</p>` : ''}
              </div>
            </div>`;
        });
      } else {
        html += `<p class="text-gray-400">No hay ejercicios seleccionados</p>`;
      }
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-black/90 flex items-center justify-center z-[100] p-4";
      modal.innerHTML = `
        <div class="bg-gray-800 rounded-3xl w-full max-w-lg max-h-[90vh] overflow-auto p-6">
          <div class="flex justify-between mb-6">
            <h2 class="text-2xl font-bold">Detalle del Entreno</h2>
            <button onclick="this.closest('.fixed').remove()" class="text-3xl text-red-500">✕</button>
          </div>
          ${html}
          <button onclick="this.closest('.fixed').remove()" class="w-full mt-6 py-4 bg-orange-600 rounded-2xl font-bold">Cerrar</button>
        </div>
      `;
      document.body.appendChild(modal);
    }
    function openPdfFromTraining(exName) {
      const ex = exercises.find(e => e.name === exName);
      if (ex && ex.pdf) {
        const a = document.createElement('a');
        a.href = ex.pdf;
        a.target = "_blank";
        a.click();
      } else {
        alert("Este ejercicio no tiene PDF");
      }
    }
    function openTrainingModal(index = null) {
      document.getElementById('trainingModal').classList.remove('hidden');
      document.getElementById('trainingForm').reset();
      document.getElementById('trainingIndex').value = index !== null ? index : '';
      renderExerciseSelector();
    }
    function closeTrainingModal() {
      document.getElementById('trainingModal').classList.add('hidden');
    }
    function renderExerciseSelector() {
      const container = document.getElementById('exerciseSelector');
      container.innerHTML = '';
      if (exercises.length === 0) {
        container.innerHTML = `<p class="text-gray-400 p-3">Primero crea ejercicios</p>`;
        return;
      }
      exercises.forEach((ex, i) => {
        const div = document.createElement('div');
        div.className = "flex items-center gap-3 p-3 hover:bg-gray-600 rounded-xl";
        div.innerHTML = `
          <input type="checkbox" id="chk-${i}" class="w-5 h-5 accent-orange-500">
          <div>
            <p class="font-medium">${ex.name}</p>
            <p class="text-xs text-gray-400">${ex.type || ''}</p>
          </div>
        `;
        container.appendChild(div);
      });
    }
    document.getElementById('trainingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const selected = [];
      exercises.forEach((_, i) => {
        if (document.getElementById(`chk-${i}`) && document.getElementById(`chk-${i}`).checked) {
          selected.push(exercises[i].name);
        }
      });
      const index = document.getElementById('trainingIndex').value;
      const training = {
        date: document.getElementById('tDate').value,
        title: document.getElementById('tTitle').value,
        time: document.getElementById('tTime').value,
        duration: document.getElementById('tDuration').value,
        exercises: selected,
        notes: document.getElementById('tNotes').value
      };
      if (index === '') trainings.push(training);
      else trainings[index] = training;
      localStorage.setItem('futsalTrainings', JSON.stringify(trainings));
      closeTrainingModal();
      showTrainings();
    });
    function editTraining(i) { openTrainingModal(i); }
    function deleteTraining(i) {
      if (confirm(`¿Borrar "${trainings[i].title}"?`)) {
        trainings.splice(i, 1);
        localStorage.setItem('futsalTrainings', JSON.stringify(trainings));
        showTrainings();
      }
    }

    // ==================== EJERCICIOS ====================
    function showExercises() {
      document.getElementById('content').innerHTML = `
        <div class="flex justify-between mb-6">
          <h2 class="text-3xl font-bold">Ejercicios (${exercises.length})</h2>
          <button onclick="openExerciseModal()" class="bg-orange-600 px-6 py-3 rounded-2xl font-bold">➕ Nuevo Ejercicio</button>
        </div>
        <div id="exGrid" class="grid grid-cols-1 gap-4"></div>
      `;
      renderExercises();
    }
    function renderExercises() {
      const grid = document.getElementById('exGrid');
      grid.innerHTML = exercises.length === 0 ? `<p class="text-center py-12 text-gray-400">Aún no hay ejercicios</p>` : '';
      exercises.forEach((ex, i) => {
        const div = document.createElement('div');
        div.className = "bg-gray-800 rounded-3xl p-6 cursor-pointer";
        div.innerHTML = `
          <h3 class="font-bold">${ex.name}</h3>
          <p class="text-orange-400">${ex.type || ''}</p>
          <div class="flex gap-3 mt-4">
            <button onclick="editExercise(${i});event.stopImmediatePropagation()" class="flex-1 py-3 bg-gray-700 rounded-2xl">Editar</button>
            <button onclick="deleteExercise(${i});event.stopImmediatePropagation()" class="flex-1 py-3 bg-red-900 rounded-2xl">Borrar</button>
          </div>
        `;
        div.onclick = (e) => {
          if (!e.target.closest('button')) openPdf(ex);
        };
        grid.appendChild(div);
      });
    }
    function openPdf(ex) {
      if (!ex.pdf) return alert("Este ejercicio no tiene PDF");
      const a = document.createElement('a');
      a.href = ex.pdf;
      a.target = "_blank";
      a.click();
    }
    function openExerciseModal(index = null) {
      document.getElementById('exerciseModal').classList.remove('hidden');
      document.getElementById('exerciseForm').reset();
      document.getElementById('exerciseIndex').value = index !== null ? index : '';
      document.getElementById('exerciseTitle').textContent = index !== null ? "Editar Ejercicio" : "Nuevo Ejercicio";
    }
    function closeExerciseModal() {
      document.getElementById('exerciseModal').classList.add('hidden');
    }
    document.getElementById('exerciseForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const index = document.getElementById('exerciseIndex').value;
      const file = document.getElementById('exPdfInput').files[0];
      const saveExercise = (pdfData) => {
        const ex = {
          name: document.getElementById('exName').value.trim(),
          type: document.getElementById('exType').value.trim(),
          duration: document.getElementById('exDuration').value,
          desc: document.getElementById('exDesc').value.trim(),
          pdf: pdfData || (exercises[index] ? exercises[index].pdf : null)
        };
        if (!ex.name) return alert("El nombre es obligatorio");
        if (index === '') exercises.push(ex);
        else exercises[index] = ex;
        localStorage.setItem('futsalExercises', JSON.stringify(exercises));
        closeExerciseModal();
        showExercises();
      };
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => saveExercise(ev.target.result);
        reader.readAsDataURL(file);
      } else {
        saveExercise(null);
      }
    });
    function editExercise(i) { openExerciseModal(i); }
    function deleteExercise(i) {
      if (confirm(`¿Borrar "${exercises[i].name}"?`)) {
        exercises.splice(i, 1);
        localStorage.setItem('futsalExercises', JSON.stringify(exercises));
        showExercises();
      }
    }

document.addEventListener('DOMContentLoaded', function() {

    const password = document.getElementById('passwordInput').value.trim();
    
    const user = users.find(u => u.username === username && u.password === password);
    
    if (user) {
      document.getElementById('loginScreen').classList.add('hidden');

      document.getElementById('mainNav').classList.remove('hidden');

      error.classList.remove('hidden');
      setTimeout(() => error.classList.add('hidden'), 3000);
    }
  }

  // Listener global ULTRA POTENTE
  document.addEventListener('touchend', function(e) {
    if (e.target.id === 'btnEntrar' || e.target.closest('#btnEntrar')) {
      e.preventDefault();
      e.stopImmediatePropagation();
      setTimeout(() => {
        checkLoginFixed();
      }, 30);
    }
  }, { passive: false });

  document.addEventListener('click', function(e) {
    if (e.target.id === 'btnEntrar' || e.target.closest('#btnEntrar')) {
      e.preventDefault();
      checkLoginFixed();
    }
  });

  console.log('✅ Fix nuclear del botón Entrar activado');
});
